name: Collect bulletins

# Twice a day (07:30 and 13:30 in Turkey): read the latest Kamu İhale Bülteni and republish the data on GitHub Pages.
on:
  schedule:
    - cron: "30 4 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: How many days back to read, today included
        default: "2"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: Test the parser
        run: python -m unittest discover -s collector/tests -t .

      - name: Start from the published data
        run: |
          mkdir -p site
          if git fetch --depth 1 origin gh-pages; then git archive FETCH_HEAD | tar -x -C site; fi

      - name: Collect
        run: python -m collector.run --out site/data --days "${{ inputs.days || '2' }}"

      # The home page and privacy policy live in pages/ on main; they go out with every run.
      - name: Add the web pages
        run: cp pages/*.html site/

      # The data branch is replaced, not appended to, so the repository does not grow with every run.
      - name: Publish
        working-directory: site
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
